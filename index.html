        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #2b1055;
            color: #333;
            user-select: none;
            touch-action: manipulation;
        }
        .title-font {

        .ruby-text rt {
            font-size: 0.55em;
            color: #d97706;
            font-weight: bold;
        }
        .game-card {
            background: linear-gradient(135deg, #ffffff 0%, #f3f4f6 100%);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }
        .btn-bounce {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn-bounce:active {
            transform: scale(0.96) translateY(4px);
            box-shadow: none !important;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.8)); }

            width: 6px;

    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'kotowaza-rpg-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

        let db = null;
        let auth = null;
        let currentUser = null;

        if (firebaseConfig) {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                const initAuth = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    currentUser = auth.currentUser;
                    window.loadGameData();
                };
                initAuth();
            } catch (e) {
                console.error("Firebase Auth initialization failed:", e);
            }
        }

        window.saveGameData = async function() {
            if (!db || !currentUser) return;
            try {
                const dataRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'progress');
                await setDoc(dataRef, {
                    level: gameState.level,
                    exp: gameState.exp,
                    unlockedProverbs: Array.from(gameState.unlockedProverbs),
                    updatedAt: new Date().toISOString()
                }, { merge: true });
            } catch (e) {
                console.error("Failed to save progress:", e);
            }
        };

        window.loadGameData = async function() {
            if (!db || !currentUser) return;
            try {
                const dataRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'progress');
                const docSnap = await getDoc(dataRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.level) gameState.level = data.level;
                    if (data.exp) gameState.exp = data.exp;
                    if (data.unlockedProverbs) gameState.unlockedProverbs = new Set(data.unlockedProverbs);
                    updateTitleAndLevel();
                }
            } catch (e) {
                console.error("Failed to load progress:", e);
            }
        };
    </script>

    <!-- JavaScript Logic -->
    <script>
        class SoundFX {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playCorrect() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                osc.frequency.setValueAtTime(1046.50, now + 0.3);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.5);
            }
            playWrong() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.setValueAtTime(180, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            }
            playLevelUp() {
                this.init();
                const now = this.ctx.currentTime;
                const notes = [440, 554.37, 659.25, 880];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                    gain.gain.setValueAtTime(0.2, now + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.1);
                    osc.stop(now + idx * 0.1 + 0.3);
                });
            }
        }

        const sound = new SoundFX();

            { id: 2, cat: "生き物・動物", kotowaza: "<ruby>犬<rt>いぬ</rt></ruby>も<ruby>歩<rt>ある</rt></ruby>けば<ruby>棒<rt>ぼう</rt></ruby>に<ruby>当<rt>あ</rt></ruby>たる", plain: "犬も歩けば棒に当たる", meaning: "<ruby>何<rt>なに</rt></ruby>か<ruby>行動<rt>こうどう</rt></ruby>を<ruby>起<rt>お</rt></ruby>こせば、<ruby>思<rt>おも</rt></ruby>わぬ<ruby>幸運<rt>こううん</rt></ruby>や<ruby>災難<rt>さいなん</rt></ruby>に<ruby>遭<rt>あ</rt></ruby>うこと。", example: "「<ruby>散歩<rt>さんぽ</rt></ruby>していたら<ruby>欲<rt>ほ</rt></ruby>しかった<ruby>本<rt>ほん</rt></ruby>を見つけたよ。<ruby>犬<rt>いぬ</rt></ruby>も<ruby>歩<rt>ある</rt></ruby>けば<ruby>棒<rt>ぼう</rt></ruby>に<ruby>当<rt>あ</rt></ruby>たるだね。」" },

            { id: 30, cat: "努力・学習", kotowaza: "<ruby>塵<rt>ちり</rt></ruby>も<ruby>積<rt>つ</rt></ruby>もれば<ruby>山<rt>やま</rt></ruby>となる", plain: "塵も積もれば山となる", meaning: "ごくわずかなものでも<ruby>積<rt>つ</rt></ruby>み<ruby>重<rt>かさ</rt></ruby>ねれば<ruby>大<rt>おお</rt></ruby>きくなること。", example: "「<ruby>毎日<rt>まいにち</rt></ruby>のお<ruby>小遣<rt>こづか</rt></ruby>いをコツコツ<ruby>貯<rt>た</rt></ruby>めたらゲームが<ruby>買<rt>か</rt></ruby>えた！<ruby>塵<rt>ちり</rt></ruby>も<ruby>積<rt>つ</rt></ruby>もれば<ruby>山<rt>やま</rt></ruby>となるだ。」" },
            { id: 31, cat: "努力・学習", kotowaza: "<ruby>習<rt>なら</rt></ruby>うより<ruby>慣<rt>な</rt></ruby>れよ", plain: "習うより慣れよ", meaning: "<ruby>教<rt>おし</rt></ruby>わるよりも<ruby>実際<rt>じっさい</rt></ruby>に<ruby>繰<rt>く</rt></ruby>り返して<ruby>体験<rt>たいけん</rt></ruby>する<ruby>方<rt>ほう</rt></ruby>が<ruby>身<rt>み</rt></ruby>につくこと。", example: "「<ruby>説明書<rt>せつめいしょ</rt></ruby>を<ruby>読<rt>よ</rt></ruby>むより<ruby>自分<rt>じぶん</rt></ruby>で<ruby>遊<rt>あそ</rt></ruby>んで<ruby>覚<rt>おぼ</rt></ruby>える<ruby>方<rt>ほう</rt></ruby>が<ruby>早<rt>はや</rt></ruby>いね。<ruby>習<rt>なら</rt></ruby>うより<ruby>慣<rt>な</rt></ruby>れよだ。」" },

            { id: 33, cat: "努力・学習", kotowaza: "<ruby>失敗<rt>しっぱい</rt></ruby>は<ruby>成功<rt>せいこう</rt></ruby>のもと", plain: "失敗は成功のもと", meaning: "<ruby>失敗<rt>しっぱい</rt></ruby>の<ruby>原因<rt>げんいん</rt></ruby>を<ruby>反省<rt>はんせい</rt></ruby>して<ruby>直<rt>なお</rt></ruby>せば<ruby>次<rt>つぎ</rt></ruby>の<ruby>成功<rt>せいこう</rt></ruby>につながること。", example: "「まちがえた<ruby>問題<rt>もんだい</rt></ruby>をやり<ruby>直<rt>なお</rt></ruby>して<ruby>次<rt>つぎ</rt></ruby>は100<ruby>点<rt>てん</rt></ruby>！<ruby>失敗<rt>しっぱい</rt></ruby>は<ruby>成功<rt>せいこう</rt></ruby>のもとだね。」" },
            { id: 34, cat: "努力・学習", kotowaza: "<ruby>聞<rt>き</rt></ruby>くは<ruby>一時<rt>いっとき</rt></ruby>の<ruby>恥<rt>はじ</rt></ruby><ruby>聞<rt>き</rt></ruby>かぬは<ruby>一生<rt>いっしょう</rt></ruby>の<ruby>恥<rt>はじ</rt></ruby>", plain: "聞くは一時の恥聞かぬは一生の恥", meaning: "<ruby>分<rt>わ</rt></ruby>からないことを<ruby>聞<rt>き</rt></ruby>くのは<ruby>一瞬<rt>いっしゅん</rt></ruby><ruby>恥<rt>はず</rt></ruby>かしいが、<ruby>放置<rt>ほうち</rt></ruby>すると<ruby>一生<rt>いっしょう</rt></ruby><ruby>恥<rt>はじ</rt></ruby>をかくこと。", example: "「<ruby>先生<rt>せんせい</rt></ruby>に<ruby>思<rt>おも</rt></ruby>い<ruby>切<rt>き</rt></ruby>って<ruby>質問<rt>しつもん</rt></ruby>してよかった！<ruby>聞<rt>き</rt></ruby>くは<ruby>一時<rt>いっとき</rt></ruby>の<ruby>恥<rt>はじ</rt></ruby><ruby>聞<rt>き</rt></ruby>かぬは<ruby>一生<rt>いっしょう</rt></ruby>の<ruby>恥<rt>はじ</rt></ruby>だ。」" },

            { id: 37, cat: "努力・学習", kotowaza: "<ruby>好<rt>す</rt></ruby>きこそ<ruby>物<rt>もの</rt></ruby>の<ruby>上手<rt>じょうず</rt></ruby>なれ", plain: "好きこそ物の上手なれ", meaning: "<ruby>好<rt>す</rt></ruby>きなことには<ruby>自然<rt>しぜん</rt></ruby>と<ruby>熱心<rt>ねっしん</rt></ruby>に<ruby>取<rt>と</rt></ruby>り<ruby>組<rt>く</rt></ruby>むので<ruby>上達<rt>じょうたつ</rt></ruby>が<ruby>早<rt>はや</rt></ruby>いこと。", example: "「<ruby>絵<rt>え</rt></ruby>を<ruby>描<rt>か</rt></ruby>くのが<ruby>大好<rt>だいす</rt></ruby>きだからぐんぐん<ruby>上達<rt>じょうたつ</rt></ruby>するね。<ruby>好<rt>す</rt></ruby>きこそ<ruby>物<rt>もの</rt></ruby>の<ruby>上手<rt>じょうず</rt></ruby>なれだ。」" },
            { id: 38, cat: "努力・学習", kotowaza: "<ruby>早起<rt>はやお</rt></ruby>きは<ruby>三文<rt>さんもん</rt></ruby>の<ruby>徳<rt>とく</rt></ruby>", plain: "早起きは三文の徳", meaning: "<ruby>朝<rt>あさ</rt></ruby><ruby>早<rt>はや</rt></ruby>く<ruby>起<rt>お</rt></ruby>きると<ruby>何<rt>なに</rt></ruby>かと<ruby>良<rt>よ</rt></ruby>いことがあること。", example: "「<ruby>早起<rt>はやお</rt></ruby>きしたら<ruby>素晴<rt>すば</rt></ruby>らしい<ruby>朝<rt>あさ</rt></ruby>やけが<ruby>見<rt>み</rt></ruby>られたよ。<ruby>早起<rt>はやお</rt></ruby>きは<ruby>三文<rt>さんもん</rt></ruby>の<ruby>徳<rt>とく</rt></ruby>だね。」" },

            // 【4. 友達・人間関係のことわざ】
            { id: 39, cat: "友達・人間関係", kotowaza: "<ruby>親<rt>した</rt></ruby>しき<ruby>仲<rt>なか</rt></ruby>にも<ruby>礼儀<rt>れいぎ</rt></ruby>あり", plain: "親しき仲にも礼儀あり", meaning: "どんなに<ruby>仲<rt>なか</rt></ruby>が<ruby>良<rt>よ</rt></ruby>くても<ruby>最低限<rt>さいていげん</rt></ruby>の<ruby>節度<rt>せつど</rt></ruby>や<ruby>礼儀<rt>れいぎ</rt></ruby>を<ruby>守<rt>まも</rt></ruby>るべきであること。", example: "「<ruby>大親友<rt>だいしんゆう</rt></ruby>の<ruby>家<rt>いえ</rt></ruby>でも<ruby>勝手<rt>かって</rt></ruby>に<ruby>冷蔵庫<rt>れいぞうこ</rt></ruby>を<ruby>開<rt>あ</rt></ruby>けちゃダメ。<ruby>親<rt>した</rt></ruby>しき<ruby>仲<rt>なか</rt></ruby>にも<ruby>礼儀<rt>れいぎ</rt></ruby>ありだよ。」" },

            { id: 41, cat: "友達・人間関係", kotowaza: "<ruby>情<rt>なさ</rt></ruby>けは<ruby>人<rt>ひと</rt></ruby>のためならず", plain: "情けは人のためならず", meaning: "<ruby>人<rt>ひと</rt></ruby>に<ruby>親切<rt>しんせつ</rt></ruby>にすると<ruby>巡<rt>めぐ</rt></ruby>り<ruby>巡<rt>めぐ</rt></ruby>って<ruby>自分<rt>じぶん</rt></ruby>に<ruby>良<rt>よ</rt></ruby>い<ruby>報<rt>むく</rt></ruby>いがくること。", example: "「<ruby>友達<rt>ともだち</rt></ruby>を<ruby>助<rt>たす</rt></ruby>けたら<ruby>後<rt>あと</rt></ruby>で<ruby>別<rt>べつ</rt></ruby>の<ruby>友達<rt>ともだち</rt></ruby>に<ruby>助<rt>たす</rt></ruby>けられた。<ruby>情<rt>なさ</rt></ruby>けは<ruby>人<rt>ひと</rt></ruby>のためならずだ。」" },
            { id: 42, cat: "友達・人間関係", kotowaza: "<ruby>人<rt>ひと</rt></ruby>のふり<ruby>見<rt>み</rt></ruby>て<ruby>我<rt>わ</rt></ruby>がふり<ruby>直<rt>なお</rt></ruby>せ", plain: "人のふり見て我がふり直せ", meaning: "<ruby>他人<rt>たにん</rt></ruby>の<ruby>行<rt>おこな</rt></ruby>いを<ruby>見<rt>み</rt></ruby>て<ruby>自分<rt>じぶん</rt></ruby>の<ruby>行動<rt>こうどう</rt></ruby>を<ruby>振<rt>ふ</rt></ruby>り<ruby>返<rt>かえ</rt></ruby>り<ruby>修正<rt>しゅうせい</rt></ruby>すること。", example: "「<ruby>友達<rt>ともだち</rt></ruby>の<ruby>態度<rt>たいど</rt></ruby>を<ruby>見<rt>み</rt></ruby>て<ruby>自分<rt>じぶん</rt></ruby>の<ruby>行<rt>おこな</rt></ruby>いを<ruby>反省<rt>はんせい</rt></ruby>したよ。<ruby>人<rt>ひと</rt></ruby>のふり<ruby>見<rt>み</rt></ruby>て<ruby>我<rt>わ</rt></ruby>がふり<ruby>直<rt>なお</rt></ruby>せだ。」" },

            { id: 55, cat: "行動・戒め", kotowaza: "<ruby>後<rt>のち</rt></ruby>の<ruby>祭<rt>まつ</rt></ruby>り", plain: "後の祭り", meaning: "<ruby>手遅<rt>ておく</rt></ruby>れになってから<ruby>後悔<rt>こうかい</rt></ruby>してもどうにもならないこと。", example: "「テストが<ruby>終<rt>お</rt></ruby>わってから<ruby>勉強<rt>べんきょう</rt></ruby>しても<ruby>後<rt>のち</rt></ruby>の<ruby>祭<rt>まつ</rt></ruby>りだよ。」" },

            { id: 60, cat: "人の心・比較", kotowaza: "どんぐりの<ruby>背比<rt>せいくら</rt></ruby>べ", plain: "どんぐりの背比べ", meaning: "どれも<ruby>似<rt>に</rt></ruby>たり<ruby>寄<rt>よ</rt></ruby>ったりで<ruby>飛<rt>と</rt></ruby>び<ruby>抜<rt>ぬ</rt></ruby>けてすぐれた<ruby>者<rt>もの</rt></ruby>がいないこと。", example: "「テストの<ruby>点数<rt>てんすう</rt></ruby>はみんな<ruby>似<rt>に</rt></ruby>たり<ruby>寄<rt>よ</rt></ruby>ったりでどんぐりの<ruby>背比<rt>せいくら</rt></ruby>べだ。」" },

            { id: 66, cat: "人の心・比較", kotowaza: "<ruby>仏<rt>ほとけ</rt></ruby>の<ruby>顔<rt>かお</rt></ruby>も<ruby>三度<rt>さんど</rt></ruby>まで", plain: "仏の顔も三度まで", meaning: "どんなに<ruby>優<rt>やさ</rt></ruby>しい<ruby>人<rt>ひと</rt></ruby>でも<ruby>何度<rt>なんど</rt></ruby>もひどいことをされれば<ruby>怒<rt>おこ</rt></ruby>り<ruby>出<rt>だ</rt></ruby>すこと。", example: "「<ruby>何度<rt>なんど</rt></ruby>もイタズラされたら<ruby>優<rt>やさ</rt></ruby>しい<ruby>先生<rt>せんせい</rt></ruby>だって<ruby>怒<rt>おこ</rt></ruby>るよ。<ruby>仏<rt>ほとけ</rt></ruby>の<ruby>顔<rt>かお</rt></ruby>も<ruby>三度<rt>さんど</rt></ruby>までだ。」" },

            { id: 95, cat: "自然・教訓", kotowaza: "<ruby>木<rt>き</rt></ruby>を<ruby>見<rt>み</rt></ruby>て<ruby>森<rt>もり</rt></ruby>を<ruby>見<rt>み</rt></ruby>ず", plain: "木を見て森を見ず", meaning: "<ruby>小<rt>ちい</rt></ruby>さな<ruby>部分<rt>ぶぶん</rt></ruby>ばかりにとらわれて<ruby>全体像<rt>ぜんたいぞう</rt></ruby>が<ruby>見<rt>み</rt></ruby>えていないこと。", example: "「<ruby>細<rt>こま</rt></ruby>かいミスばかり<ruby>気<rt>き</rt></ruby>にして<ruby>全体<rt>ぜんたい</rt></ruby>が<ruby>進<rt>すす</rt></ruby>まない。<ruby>木<rt>き</rt></ruby>を<ruby>見<rt>み</rt></ruby>て<ruby>森<rt>もり</rt></ruby>を<ruby>見<rt>み</rt></ruby>ずにならないようにね。」" },
            { id: 96, cat: "自然・教訓", kotowaza: "<ruby>船頭<rt>せんどう</rt></ruby><ruby>多<rt>おお</rt></ruby>くして<ruby>船<rt>ふね</rt></ruby><ruby>山<rt>やま</rt></ruby>に<ruby>登<rt>のぼ</rt></ruby>る", plain: "船頭多くして船山に登る", meaning: "<ruby>指図<rt>さしず</rt></ruby>する<ruby>人<rt>ひと</rt></ruby>が<ruby>多<rt>おお</rt></ruby>すぎてまとまらず<ruby>間違<rt>まちが</rt></ruby>った<ruby>方向<rt>ほうこう</rt></ruby>へ<ruby>進<rt>すす</rt></ruby>むこと。", example: "「みんなが<ruby>好<rt>す</rt></ruby>き<ruby>勝手<rt>かって</rt></ruby>に<ruby>指示<rt>しじ</rt></ruby>を<ruby>出<rt>だ</rt></ruby>してまとまらない、<ruby>船頭<rt>せんどう</rt></ruby><ruby>多<rt>おお</rt></ruby>くして<ruby>船<rt>ふね</rt></ruby><ruby>山<rt>やま</rt></ruby>に<ruby>登<rt>のぼ</rt></ruby>るだ。」" },

            // 【10. 親子・結末】
            { id: 97, cat: "親子・結末", kotowaza: "かわいい<ruby>子<rt>こ</rt></ruby>には<ruby>旅<rt>たび</rt></ruby>をさせよ", plain: "かわいい子には旅をさせよ", meaning: "<ruby>子供<rt>こども</rt></ruby>が<ruby>愛<rt>いとお</rt></ruby>しいなら<ruby>甘<rt>あま</rt></ruby>ややかさず<ruby>外<rt>そと</rt></ruby>で<ruby>苦労<rt>くろう</rt></ruby>や<ruby>経験<rt>けいけん</rt></ruby>をさせるべきだということ。", example: "「<ruby>一人<rt>ひとり</rt></ruby>でキャンプに<ruby>行<rt>い</rt></ruby>かせるのは、かわいい<ruby>子<rt>こ</rt></ruby>には<ruby>旅<rt>たび</rt></ruby>をさせよの<ruby>気持<rt>きも</rt></ruby>ちからだ。」" },
            { id: 98, cat: "親子・結末", kotowaza: "<ruby>親<rt>おや</rt></ruby><ruby>思<rt>おも</rt></ruby>う<ruby>心<rt>こころ</rt></ruby>に<ruby>勝<rt>まさ</rt></ruby>る<ruby>親心<rt>おやごころ</rt></ruby>", plain: "親思う心に勝る親心", meaning: "<ruby>子供<rt>こども</rt></ruby>が<ruby>親<rt>おや</rt></ruby>を<ruby>大切<rt>たいせつ</rt></ruby>に<ruby>想<rt>おも</rt></ruby>う<ruby>気持<rt>きも</rt></ruby>ち<ruby>以上<rt>いじょう</rt></ruby>に<ruby>親<rt>おや</rt></ruby>が<ruby>子<rt>こ</rt></ruby>を<ruby>想<rt>おも</rt></ruby>う<ruby>愛<rt>あい</rt></ruby>の<ruby>方<rt>ほう</rt></ruby>が<ruby>深<rt>ふか</rt></ruby>いこと。", example: "「<ruby>子供<rt>こども</rt></ruby>の<ruby>心配<rt>しんぱい</rt></ruby>をするお<ruby>母<rt>かあ</rt></ruby>さんの<ruby>深<rt>ふか</rt></ruby>い<ruby>愛<rt>あい</rt></ruby>は、<ruby>親<rt>おや</rt></ruby><ruby>思<rt>おも</rt></ruby>う<ruby>心<rt>こころ</rt></ruby>に<ruby>勝<rt>まさ</rt></ruby>る<ruby>親心<rt>おやごころ</rt></ruby>だね。」" },
            { id: 99, cat: "親子・結末", kotowaza: "<ruby>親<rt>おや</rt></ruby>の<ruby>心<rt>こころ</rt></ruby><ruby>子<rt>こ</rt></ruby><ruby>知<rt>し</rt></ruby>らず", plain: "親の心子知らず", meaning: "<ruby>親<rt>おや</rt></ruby>が<ruby>子供<rt>こども</rt></ruby>を<ruby>想<rt>おも</rt></ruby>う<ruby>温<rt>あたた</rt></ruby>かい<ruby>気持<rt>きも</rt></ruby>ちや<ruby>苦労<rt>くろう</rt></ruby>を<ruby>子供<rt>こども</rt></ruby>は<ruby>分<rt>わ</rt></ruby>かってくれないこと。", example: "「<ruby>心配<rt>しんぱい</rt></ruby>して<ruby>言<rt>い</rt></ruby>ってくれているのに<ruby>反抗<rt>はんこう</rt></ruby>してしまう、<ruby>親<rt>おや</rt></ruby>の<ruby>心<rt>こころ</rt></ruby><ruby>子<rt>こ</rt></ruby><ruby>知<rt>し</rt></ruby>らずだね。」" },
            { id: 100, cat: "親子・結末", kotowaza: "<ruby>終<rt>お</rt></ruby>わり<ruby>良<rt>よ</rt></ruby>ければ<ruby>全<rt>すべ</rt></ruby>て<ruby>良<rt>よ</rt></ruby>し", plain: "終わり良ければ全て良し", meaning: "<ruby>過程<rt>かてい</rt></ruby>で<ruby>苦労<rt>くろう</rt></ruby>があっても<ruby>結末<rt>けつまつ</rt></ruby>が<ruby>良好<rt>りょうこう</rt></ruby>であれば<ruby>全<rt>すべ</rt></ruby>て<ruby>良<rt>よ</rt></ruby>いと<ruby>思<rt>おも</rt></ruby>えること。", example: "「いろいろ<ruby>大変<rt>たいへん</rt></ruby>だったけれど<ruby>最後<rt>さいご</rt></ruby>は<ruby>大成功<rt>だいせいこう</rt></ruby>！<ruby>終<rt>お</rt></ruby>わり<ruby>良<rt>よ</rt></ruby>ければ<ruby>全<rt>すべ</rt></ruby>て<ruby>良<rt>よ</rt></ruby>しだね。」" }
        ];

        const MONSTERS = [
            { name: "ことわざモグラ", icon: "👾" },
            { name: "ナゾトキゴブリン", icon: "👺" },
            { name: "漢字ドラゴン", icon: "🐉" },
            { name: "マモノオオカミ", icon: "🐺" },
            { name: "ことわざ魔王", icon: "🦹‍♂️" },
            { name: "ちえのフクロウ", icon: "🦉" },
            { name: "ひらめきゴーレム", icon: "🗿" },
            { name: "じゅけんナイト", icon: "⚔️" },
            { name: "ことわざタイガー", icon: "🐯" },
            { name: "ことわざ大魔神", icon: "👹" }
        ];

        let gameState = {
            level: 1,
            exp: 0,
            score: 0,
            currentQuestionIndex: 0,
            questions: [],
            correctCount: 0,
            combo: 0,
            unlockedProverbs: new Set(),
            selectedCategoryFilter: "すべて"
        };

        const screens = {
            start: document.getElementById('start-screen'),
            quiz: document.getElementById('quiz-screen'),
            result: document.getElementById('result-screen'),
            zukan: document.getElementById('zukan-screen')
        };

        function showScreen(screenName) {
            Object.keys(screens).forEach(key => {
                screens[key].classList.add('hidden');
            });
            screens[screenName].classList.remove('hidden');
        }

        function updateTitleAndLevel() {
            const levelTitles = [
                "見習い勇者", "ことわざ見習い", "ことわざ冒険者", 
                "ことわざ物知り", "ことわざ博士", "ことわざマスター", "語彙力の神"
            ];
            const titleIndex = Math.min(Math.floor((gameState.level - 1) / 2), levelTitles.length - 1);
            
            document.getElementById('user-level').innerText = gameState.level;
            document.getElementById('user-title').innerText = levelTitles[titleIndex];
        }

        function startQuiz() {
            const shuffled = [...PROVERBS].sort(() => 0.5 - Math.random());
            gameState.questions = shuffled.slice(0, 5);
            gameState.currentQuestionIndex = 0;
            gameState.score = 0;
            gameState.correctCount = 0;
            gameState.combo = 0;

            document.getElementById('quiz-score').innerText = "0";
            updateComboUI();

            showScreen('quiz');
            loadQuestion();
        }

        function loadQuestion() {
            const qData = gameState.questions[gameState.currentQuestionIndex];
            const monster = MONSTERS[gameState.currentQuestionIndex % MONSTERS.length];

            document.getElementById('current-q-num').innerText = gameState.currentQuestionIndex + 1;
            document.getElementById('monster-avatar').innerText = monster.icon;
            document.getElementById('monster-name').innerText = monster.name;
            document.getElementById('monster-hp').style.width = '100%';

            const badge = document.getElementById('q-type-badge');
            const qText = document.getElementById('question-text');
            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';

            // 意味バッジ・問題文ともにふりがなを適応
            badge.innerHTML = `💡 [${qData.cat}] この<ruby>意味<rt>いみ</rt></ruby>のことわざは？`;
            badge.className = "text-xs font-bold text-amber-800 bg-amber-100 inline-block px-2.5 py-0.5 rounded-full mb-2 w-max ruby-text";
            qText.innerHTML = `「<span class="text-indigo-600 font-extrabold">${qData.meaning}</span>」`;

            const choices = generateChoices(qData);
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = "btn-bounce bg-white hover:bg-amber-50 text-slate-800 font-bold p-3 rounded-xl border-2 border-slate-200 shadow text-left flex items-center justify-between text-sm sm:text-base ruby-text";
                btn.innerHTML = `<span>${choice.kotowaza}</span> <i class="fa-regular fa-circle text-slate-300"></i>`;
                btn.onclick = () => checkAnswer(choice.id === qData.id, btn);
                optionsGrid.appendChild(btn);
            });
        }

        function generateChoices(correctItem) {
            const wrongOptions = PROVERBS.filter(item => item.id !== correctItem.id)
                                         .sort(() => 0.5 - Math.random())
                                         .slice(0, 3);
            return [...wrongOptions, correctItem].sort(() => 0.5 - Math.random());
        }

        function checkAnswer(isCorrect, btnElement) {
            const qCard = document.getElementById('question-card');
            const monsterAvatar = document.getElementById('monster-avatar');
            const qData = gameState.questions[gameState.currentQuestionIndex];

            const allBtns = document.querySelectorAll('#options-grid button');
            allBtns.forEach(b => b.disabled = true);

            if (isCorrect) {
                sound.playCorrect();
                btnElement.classList.remove('bg-white', 'border-slate-200');
                btnElement.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900');
                btnElement.querySelector('i').className = "fa-solid fa-circle-check text-emerald-500 text-xl";

                monsterAvatar.classList.add('animate-shake');
                document.getElementById('monster-hp').style.width = '0%';

                confetti({
                    particleCount: 40,
                    spread: 60,
                    origin: { y: 0.7 }
                });

                gameState.unlockedProverbs.add(qData.id);

                gameState.combo++;
                gameState.correctCount++;
                const comboBonus = (gameState.combo - 1) * 20;
                const earnedScore = 100 + comboBonus;
                gameState.score += earnedScore;

                document.getElementById('quiz-score').innerText = gameState.score;
                updateComboUI();

            } else {
                sound.playWrong();
                btnElement.classList.remove('bg-white', 'border-slate-200');
                btnElement.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-900');
                btnElement.querySelector('i').className = "fa-solid fa-circle-xmark text-rose-500 text-xl";

                qCard.classList.add('animate-shake');
                gameState.combo = 0;
                updateComboUI();
            }

            // Save Progress Data on Cloud
            if (typeof window.saveGameData === 'function') {
                window.saveGameData();
            }

            setTimeout(() => {
                monsterAvatar.classList.remove('animate-shake');
                qCard.classList.remove('animate-shake');

                gameState.currentQuestionIndex++;
                if (gameState.currentQuestionIndex < gameState.questions.length) {
                    loadQuestion();
                } else {
                    finishQuiz();
                }
            }, 1200);
        }

        function updateComboUI() {
            const badge = document.getElementById('combo-badge');
            if (gameState.combo > 1) {
                badge.classList.remove('hidden');
                document.getElementById('combo-count').innerText = gameState.combo;
            } else {
                badge.classList.add('hidden');
            }
        }

        function finishQuiz() {
            showScreen('result');
            sound.playLevelUp();

            document.getElementById('result-correct').innerText = gameState.correctCount;
            document.getElementById('result-score').innerText = `${gameState.score} 点`;

            const expGained = gameState.score / 2;
            document.getElementById('result-exp').innerText = `+${expGained} EXP`;

            gameState.exp += expGained;
            const expNeeded = gameState.level * 100;

            const levelMsg = document.getElementById('level-up-msg');
            if (gameState.exp >= expNeeded) {
                gameState.level++;
                gameState.exp -= expNeeded;
                levelMsg.innerText = `🎉 レベルアップ！ Lv.${gameState.level} になった！`;
            } else {
                levelMsg.innerText = `つぎのレベルまで あと ${expNeeded - gameState.exp} EXP`;
            }

            updateTitleAndLevel();

            // Save progress to cloud
            if (typeof window.saveGameData === 'function') {
                window.saveGameData();
            }

            setTimeout(() => {
                const percent = Math.min((gameState.exp / (gameState.level * 100)) * 100, 100);
                document.getElementById('exp-bar').style.width = `${percent}%`;
            }, 300);
        }

        function setupZukanCategories() {
            const catContainer = document.getElementById('zukan-categories');
            catContainer.innerHTML = '';

            const categories = ["すべて", ...new Set(PROVERBS.map(p => p.cat))];

            categories.forEach(cat => {
                const badge = document.createElement('button');
                const isSelected = gameState.selectedCategoryFilter === cat;
                badge.className = `px-3 py-1 rounded-full whitespace-nowrap transition-colors font-bold ${
                    isSelected 
                        ? 'bg-amber-400 text-slate-900 shadow' 
                        : 'bg-slate-800 text-slate-400 hover:bg-slate-700'
                }`;
                badge.innerText = cat;
                badge.onclick = () => {
                    gameState.selectedCategoryFilter = cat;
                    setupZukanCategories();
                    renderZukan();
                };
                catContainer.appendChild(badge);
            });
        }

        function renderZukan() {
            const listContainer = document.getElementById('zukan-list');
            listContainer.innerHTML = '';

            document.getElementById('zukan-count').innerText = gameState.unlockedProverbs.size;

            const filtered = gameState.selectedCategoryFilter === "すべて"
                ? PROVERBS
                : PROVERBS.filter(p => p.cat === gameState.selectedCategoryFilter);

            filtered.forEach(item => {
                const isUnlocked = gameState.unlockedProverbs.has(item.id);
                const card = document.createElement('div');

                if (isUnlocked) {
                    card.className = "bg-slate-800 border-2 border-amber-400/60 rounded-xl p-3.5 shadow";
                    card.innerHTML = `
                        <div class="flex items-center justify-between mb-1">
                            <h3 class="text-base sm:text-lg font-bold text-amber-300 ruby-text">${item.kotowaza}</h3>
                            <span class="text-xs bg-emerald-900/60 text-emerald-300 px-2 py-0.5 rounded border border-emerald-500/30 whitespace-nowrap"><i class="fa-solid fa-check"></i> はっけん</span>
                        </div>
                        <div class="text-[10px] text-amber-400/80 mb-1 font-bold">ジャンル: ${item.cat}</div>
                        <p class="text-xs sm:text-sm text-slate-200 mb-2 leading-relaxed ruby-text">${item.meaning}</p>
                        <div class="text-xs bg-slate-900/80 p-2 rounded text-indigo-200 border border-slate-700 ruby-text">
                            💬 ${item.example}
                        </div>
                    `;
                } else {
                    card.className = "bg-slate-800/50 border border-slate-700 rounded-xl p-3 opacity-60 flex items-center space-x-3";
                    card.innerHTML = `
                        <div class="w-10 h-10 bg-slate-700 rounded-full flex items-center justify-center text-slate-500 text-lg flex-shrink-0">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <div>
                            <div class="text-sm font-bold text-slate-400"> No.${item.id} ？？？？？</div>
                            <div class="text-xs text-slate-500">ジャンル: ${item.cat}（クイズで正解すると解放！）</div>
                        </div>
                    `;
                }

                listContainer.appendChild(card);
            });

            showScreen('zukan');
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            sound.init();
            startQuiz();
        });

        document.getElementById('retry-btn').addEventListener('click', () => {
            startQuiz();
        });

        document.getElementById('back-to-start-btn').addEventListener('click', () => {
            showScreen('start');
        });

        document.getElementById('zukan-btn').addEventListener('click', () => {
            sound.init();
            setupZukanCategories();
            renderZukan();
        });

        document.getElementById('zukan-back-btn').addEventListener('click', () => {
            showScreen('start');
        });

        document.getElementById('quiz-quit-btn').addEventListener('click', () => {
            showScreen('start');
        });

        // Initialize Level Display
        updateTitleAndLevel();
    </script>
</body>
</html>
